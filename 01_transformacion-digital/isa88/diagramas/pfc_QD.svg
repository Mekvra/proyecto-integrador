<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="900" height="957" fill="#ffffff"/><text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Receta maestra QD · Doble crema</text>
<text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Diagrama de procedimiento ISA-88 · celda PC22 · lote de 10.000 L · 10 lotes por semana</text>
<rect x="70" y="84" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Tronco común · UP-LB1 recepción → UP-LB2 pasteurización → UP-LB3 silo</text>
<text x="450.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Lote de leche base liberado del silo U124A/B · grasa 3,6 % + crema (mezcla al 4,2 %)</text>
<text x="816" y="106" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-1 · PCC-2</text>
<line x1="450.0" y1="136" x2="450.0" y2="162" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="162" width="760" height="175" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="162" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q1  ·  Tina</text>
<text x="818" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U221A · U221B · U221C</text>
<text x="92" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Agregar la crema al llenar: 160 L al 40 % por FQI-2212; solo crema liberada</text>
<text x="818" y="212" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-3</text>
<text x="92" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Llenar y atemperar: leche al 3,6 % a 32 a 35 °C en E-2210</text>
<text x="92" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Madurar: CaCl₂ 5 L + cultivo mesófilo 100 U; 20 a 30 min, agitación lenta</text>
<text x="92" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Coagular: cuajo 2,2 L; reposo 30 a 40 min hasta corte limpio</text>
<text x="92" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cortar: cubos de 1 a 1,5 cm; reposo de 5 min</text>
<text x="92" y="307" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cocinar y desuerar: en el límite inferior (≈ 40 °C) para retener humedad; retirar el 85 %</text>
<text x="107" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">del suero</text>
<line x1="450.0" y1="337" x2="450.0" y2="363" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="363" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="363" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="383" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q2  ·  Acidificación</text>
<text x="818" y="383" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U222</text>
<text x="92" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Acidificar la cuajada: 35 a 38 °C hasta pH 5,2 a 5,3; prueba de estiramiento</text>
<line x1="450.0" y1="424" x2="450.0" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="450" width="760" height="99" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="450" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q3  ·  Hilado y moldeo</text>
<text x="818" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U223</text>
<text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Hilar: agua de hilado a 75 a 85 °C; pasta a 58 a 62 °C</text>
<text x="92" y="519" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Salar en la hiladora: sal al 1,2 % (báscula WI-2232)</text>
<text x="92" y="538" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Moldear: bloques de 500 g y 2,5 kg</text>
<line x1="450.0" y1="549" x2="450.0" y2="575" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="575" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="575" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="595" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q4  ·  Enfriamiento y salado</text>
<text x="818" y="595" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U224</text>
<text x="92" y="625" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar: canal de agua a 4 a 10 °C</text>
<line x1="450.0" y1="636" x2="450.0" y2="662" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="662" width="760" height="80" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="662" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="682" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q5  ·  Empaque</text>
<text x="818" y="682" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U321</text>
<text x="92" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Detectar metales: antes de la empacadora</text>
<text x="818" y="712" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-7</text>
<text x="92" y="731" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Empacar al vacío y sellar: etiqueta con lote, fecha y vencimiento</text>
<line x1="450.0" y1="742" x2="450.0" y2="768" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="768" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="768" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="788" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Q6  ·  Cámara</text>
<text x="818" y="788" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U414</text>
<text x="92" y="818" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Conservar: 2 a 4 °C, reposo de 12 h; camión de 2 a 6 °C</text>
<line x1="450.0" y1="829" x2="450.0" y2="855" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="855" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.6"/>
<text x="450.0" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Producto terminado · ≈ 1.330 kg (≈ 7,5 L de leche por kg)</text>
<text x="450.0" y="895" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Bloque 500 g · U321 · Bloque 2,5 kg · U321</text>
<text x="70" y="937" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Rojo: punto crítico de control (PCC) del plan HACCP. Valores de diseño tomados de las recetas y del modelo procedimental.</text></svg>