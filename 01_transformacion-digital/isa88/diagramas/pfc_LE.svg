<rect x="70" y="162" width="760" height="80" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="162" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L1  ·  Mezcla</text>
<text x="818" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U231</text>
<text x="92" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cargar la leche: 10.000 L desde U125A</text>
<text x="92" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Verificar la grasa: 3,0 %; ajustar si hace falta</text>
<line x1="450.0" y1="242" x2="450.0" y2="268" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="268" width="760" height="118" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="268" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="288" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L2  ·  Tratamiento UHT</text>
<text x="818" y="288" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U232</text>
<text x="92" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Precalentar y desairear: regeneración y desaireador</text>
<text x="92" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Esterilizar: 137 °C por 4 s; desvío y recirculación si baja</text>
<text x="818" y="337" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-8</text>
<text x="92" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Homogeneizar en aséptico: 200/50 bar a unos 70 °C</text>
<text x="92" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar: 20 a 25 °C</text>
<line x1="450.0" y1="386" x2="450.0" y2="412" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
