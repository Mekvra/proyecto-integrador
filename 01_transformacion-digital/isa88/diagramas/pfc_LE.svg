<text x="82" y="432" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L3  ·  Almacenamiento estéril</text>
<text x="818" y="432" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U233</text>
<text x="92" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Guardar en estéril: presión positiva con aire estéril filtrado</text>
