<text x="82" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L4  ·  Envasado aséptico</text>
<text x="818" y="519" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U331</text>
<text x="92" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Esterilizar el envase: baño de H₂O₂ y secado con aire estéril caliente</text>
<text x="818" y="549" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-9</text>
<text x="92" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Llenar y sellar: caja de 1 L con tapa</text>
<line x1="450.0" y1="579" x2="450.0" y2="605" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="605" width="760" height="99" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="605" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="625" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L5  ·  Retención y liberación</text>
<text x="818" y="625" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U413</text>
<text x="92" y="655" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Muestrear: cajas del inicio, del medio y del final</text>
<text x="92" y="674" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Incubar y probar: 30 a 35 °C por 7 días; ATP a las 24 a 48 h</text>
<text x="92" y="693" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Liberar: esterilidad comercial (NTC 4433)</text>
<line x1="450.0" y1="704" x2="450.0" y2="730" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="730" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.6"/>
<text x="450.0" y="752" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Producto terminado · ≈ 9.800 cajas de 1 L (2 % de merma)</text>
<text x="450.0" y="770" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Caja 1 L en bandejas de 12 · U331</text>
<text x="70" y="812" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Rojo: punto crítico de control (PCC) del plan HACCP. Valores de diseño tomados de las recetas y del modelo procedimental.</text></svg>