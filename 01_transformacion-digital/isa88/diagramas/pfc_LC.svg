<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 957" width="900" height="957"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="900" height="957" fill="#ffffff"/><text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Receta maestra LC · Leche con chocolate UHT</text>
<text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Diagrama de procedimiento ISA-88 · celda PC23 · lote de 10.000 L · 6 lotes por semana</text>
<rect x="70" y="84" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Tronco común · UP-LB1 recepción → UP-LB2 pasteurización → UP-LB3 silo</text>
<text x="450.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Lote de leche base liberado del silo U125A · grasa 3,0 %</text>
<text x="816" y="106" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-1 · PCC-2</text>
<line x1="450.0" y1="136" x2="450.0" y2="162" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="162" width="760" height="118" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="162" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L1  ·  Mezcla</text>
<text x="818" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U231</text>
<text x="92" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cargar y calentar la leche: 9.210 L desde U125A a 60 a 65 °C</text>
<text x="92" y="231" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Premezclar en seco: carragenina con azúcar, 1 a 10</text>
<text x="92" y="250" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Incorporar sólidos por la tolva: azúcar 620 kg, cacao 125 kg, carragenina 2,6 kg (WI-2312)</text>
<text x="92" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Mezclar: 20 min con recirculación (EM-2313)</text>
<line x1="450.0" y1="280" x2="450.0" y2="306" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="306" width="760" height="118" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="306" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L2  ·  Tratamiento UHT</text>
<text x="818" y="326" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U232</text>
<text x="92" y="356" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Precalentar y desairear: regeneración y desaireador</text>
<text x="92" y="375" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Esterilizar: 137 °C por 4 s; desvío y recirculación si baja</text>
<text x="818" y="375" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-8</text>
<text x="92" y="394" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Homogeneizar en aséptico: 200/50 bar a unos 70 °C</text>
<text x="92" y="413" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar: 20 a 25 °C</text>
<line x1="450.0" y1="424" x2="450.0" y2="450" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="450" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="450" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="470" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L3  ·  Almacenamiento estéril</text>
<text x="818" y="470" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U233</text>
<text x="92" y="500" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Guardar en estéril: presión positiva con aire estéril filtrado</text>
<line x1="450.0" y1="511" x2="450.0" y2="537" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="537" width="760" height="80" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="537" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="557" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L4  ·  Envasado aséptico</text>
<text x="818" y="557" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U331</text>
<text x="92" y="587" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Esterilizar el envase: baño de H₂O₂ y secado con aire estéril caliente</text>
<text x="818" y="587" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-9</text>
<text x="92" y="606" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Llenar y sellar: caja de 1 L con tapa</text>
<line x1="450.0" y1="617" x2="450.0" y2="643" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="643" width="760" height="99" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="643" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="663" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L5  ·  Retención y liberación</text>
<text x="818" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U413</text>
<text x="92" y="693" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Muestrear: cajas del inicio, del medio y del final</text>
<text x="92" y="712" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Incubar y probar: 30 a 35 °C por 7 días; ATP a las 24 a 48 h</text>
<text x="92" y="731" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Liberar: esterilidad comercial (NTC 4433)</text>
<line x1="450.0" y1="742" x2="450.0" y2="768" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="768" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="768" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="788" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-L6  ·  Limpieza intermedia</text>
<text x="818" y="788" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U232 · U233</text>
<text x="92" y="818" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Lavar la planta UHT: CIP intermedio de 30 min antes de volver a leche entera</text>
<line x1="450.0" y1="829" x2="450.0" y2="855" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="855" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.6"/>
<text x="450.0" y="877" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Producto terminado · 10.250 kg (≈ 9.520 cajas de 1 L)</text>
<text x="450.0" y="895" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Caja 1 L en bandejas de 12 · U331</text>
<text x="70" y="937" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Rojo: punto crítico de control (PCC) del plan HACCP. Valores de diseño tomados de las recetas y del modelo procedimental.</text></svg>