<text x="60" y="1170" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14202b" text-anchor="start" >Un VSM por línea sobre el mismo tronco común. Uso = trabajo + alistamiento + fallas en 12 semanas simuladas en Tecnomatix (modelo planta-150k). C/T por lote de 10.000 L.</text>
<text x="60" y="1188" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14202b" text-anchor="start" >La única línea al límite es la de yogures (llenadora de vasos U311); quesos y leche UHT tienen holgura para crecer con el aumento de acopio del contrato. Valor agregado: tratamientos térmicos, fermentación o cuajado, hilado, salado y envasado.</text>
<text x="60" y="1206" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#14202b" text-anchor="start" >Las esperas en tanques (≤ 4 h), silos (≤ 2 h), cámara y cuarentena son supuestos del modelo; los tiempos de quesos y leche UHT salen de las recetas básicas de la planta v1.0.</text></svg></body></html>
