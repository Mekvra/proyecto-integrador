<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1044" width="900" height="1044"><defs><marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker></defs><rect width="900" height="1044" fill="#ffffff"/><text x="70" y="34" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#000000" text-anchor="start">Receta maestra YG · Yogurt griego</text>
<text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#555555" text-anchor="start">Diagrama de procedimiento ISA-88 · celda PC21 · lote de 10.000 L · 9 lotes por semana</text>
<rect x="70" y="84" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="450.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Tronco común · UP-LB1 recepción → UP-LB2 pasteurización → UP-LB3 silo</text>
<text x="450.0" y="124" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Lote de leche base liberado del silo U123C · grasa 0,05 % o menos</text>
<text x="816" y="106" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-1 · PCC-2</text>
<line x1="450.0" y1="136" x2="450.0" y2="162" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="162" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="162" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="182" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y1  ·  Formulación</text>
<text x="818" y="182" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U201</text>
<text x="92" y="212" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cargar la leche: 10.350 kg desde U123C, sin leche en polvo</text>
<line x1="450.0" y1="223" x2="450.0" y2="249" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="249" width="760" height="99" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="249" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="269" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y2  ·  Tratamiento de la base</text>
<text x="818" y="269" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U202</text>
<text x="92" y="299" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Homogeneizar (opcional): 100 bar</text>
<text x="92" y="318" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Calentar y retener: 92 °C por 5 min; desvío si baja de 90 °C</text>
<text x="818" y="318" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-4</text>
<text x="92" y="337" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar a inoculación: 43 °C</text>
<line x1="450.0" y1="348" x2="450.0" y2="374" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="374" width="760" height="99" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="374" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="394" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y3  ·  Fermentación</text>
<text x="818" y="394" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U211 · U212 · U213 · U218</text>
<text x="92" y="424" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Inocular al llenar y agitar: 400 U de cultivo de pH estable; 10 min a 15 a 20 rpm</text>
<text x="92" y="443" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Incubar sin agitación: 43 °C, unas 5,5 h (5,0 a 6,5 h)</text>
<text x="92" y="462" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Cortar la fermentación: pH 4,55; alarma si pasan 6,5 h</text>
<line x1="450.0" y1="473" x2="450.0" y2="499" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="499" width="760" height="118" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="499" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="519" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y5  ·  Separación</text>
<text x="818" y="519" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U216</text>
<text x="92" y="549" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Agitar: lento, 10 a 15 min</text>
<text x="92" y="568" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Separar el suero: 40 a 42 °C, 7.000 L/h (unas 1,4 h); proteína 9,6 ± 0,2 %</text>
<text x="92" y="587" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar el concentrado: 10 a 12 °C, de inmediato</text>
<text x="92" y="606" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Restituir la grasa: crema al 40 % de U127, 155 kg; solo crema liberada</text>
<text x="818" y="606" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-3</text>
<line x1="450.0" y1="617" x2="450.0" y2="643" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="643" width="760" height="61" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="643" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="663" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y6  ·  Pulmón</text>
<text x="818" y="663" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U217A · U217B</text>
<text x="92" y="693" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Mantener hasta el llenado: 12 °C o menos, un lote por pulmón, máximo 12 h</text>
<line x1="450.0" y1="704" x2="450.0" y2="730" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="730" width="760" height="80" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="730" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="750" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y8  ·  Envasado</text>
<text x="818" y="750" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U313</text>
<text x="92" y="780" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Detectar metales en la tubería: sin metal sobre el patrón</text>
<text x="818" y="780" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b00020" text-anchor="end">PCC-5</text>
<text x="92" y="799" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Llenar, sellar y codificar: llenado a 10 a 12 °C (unas 3,2 h); mordaza a 180 a 220 °C</text>
<line x1="450.0" y1="810" x2="450.0" y2="836" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="836" width="760" height="80" rx="0" fill="none" stroke="#000000" stroke-width="1.2"/>
<rect x="70" y="836" width="760" height="30" rx="0" fill="#f2f2f2" stroke="#000000" stroke-width="1.2"/>
<text x="82" y="856" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="start">UP-Y9  ·  Cámara</text>
<text x="818" y="856" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="end">U411</text>
<text x="92" y="886" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Enfriar y madurar: 6 °C o menos en 12 h; reposo de 12 h a 2 a 4 °C</text>
<text x="92" y="905" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#000000" text-anchor="start">–  Despachar: FEFO, camión de 2 a 6 °C</text>
<line x1="450.0" y1="916" x2="450.0" y2="942" stroke="#000000" stroke-width="1.2" marker-end="url(#f)"/>
<rect x="70" y="942" width="760" height="52" rx="26" fill="none" stroke="#000000" stroke-width="1.6"/>
<text x="450.0" y="964" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#000000" text-anchor="middle">Producto terminado · 3.242 kg</text>
<text x="450.0" y="982" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#555555" text-anchor="middle">Vaso 150 g · U313 · Pote 500 g · U313</text>
<text x="70" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="11.5" font-weight="400" fill="#555555" text-anchor="start">Rojo: punto crítico de control (PCC) del plan HACCP. Valores de diseño tomados de las recetas y del modelo procedimental.</text></svg>